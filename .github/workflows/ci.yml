name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Rebuild processed data and verify it is reproducible
        run: |
          python build_data.py
          git diff --exit-code -- data/processed/ \
            || (echo "::error::data/processed/ is out of date - rerun build_data.py and commit" && exit 1)

      - name: Cross-verify every claim against the raw data
        run: python verify_claims.py

      - name: Smoke test every chapter
        run: python test_app.py
